title: User Added To A Privileged Local Or Domain Group
id: 71e3b5df-01d1-4391-9dad-627dc0ab7332
status: experimental
description: |
  Detects an account being added to a security-enabled group (4732 local, 4728 global, 4756 universal)
  whose name suggests admin privileges. Adding accounts to admin groups is a common privilege escalation and persistence step.
author: Kam'ron Washington
date: 2026-10-23
references:
  - https://attack.mitre.org/techniques/T1098/
tags:
  - attack.persistence
  - attack.privilege-escalation
  - attack.t1098
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID:
      - 4728
      - 4732
      - 4756
    TargetUserName|contains:
      - 'Admin'
      - 'Remote Desktop Users'
  condition: selection
falsepositives:
  - Approved IT changes (correlate with ticketing)
level: high
